name: Build Signed Release APK & Play Store AAB

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK & AAB (com.bawamobilsr.gecckocreator v1.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Upload Keystore Automatically (or Restore from Secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'BawaMobilSR2026!' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'BawaMobilSR2026!' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan Keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          elif [ ! -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            echo "Membuat Signature Keystore otomatis (my-upload-key.jks) untuk Google Play Store..."
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Bawa Mobil SR, OU=Mobile Development, O=GecckoCreator, L=Surabaya, ST=East Java, C=ID"
          fi

          # Pastikan debug.keystore juga tersedia jika dibutuhkan oleh konfigurasi build
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Signed Release APK & Play Store AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'BawaMobilSR2026!' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'BawaMobilSR2026!' }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            gradle assembleRelease bundleRelease --stacktrace
          fi

      - name: Prepare Release Artifacts Directory
        run: |
          mkdir -p release-output
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-output/bawa-mobil-sr-v1.0-release.apk \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} release-output/bawa-mobil-sr-v1.0-release.aab \;
          cp "${GITHUB_WORKSPACE}/my-upload-key.jks" release-output/my-upload-key.jks
          cat << 'EOF' > release-output/KEYSTORE-INFO.txt
          =============================================================
          INFORMASI SIGNATURE KEY & PAKET RILIS (GOOGLE PLAY STORE)
          =============================================================
          Nama Aplikasi  : Bawa Mobil SR
          Package Name   : com.bawamobilsr.gecckocreator
          Version Name   : 1.0
          Version Code   : 1
          Keystore File  : my-upload-key.jks
          Key Alias      : upload
          Store Password : (Sesuai secret STORE_PASSWORD atau default: BawaMobilSR2026!)
          Key Password   : (Sesuai secret KEY_PASSWORD atau default: BawaMobilSR2026!)

          PENTING UNTUK UPLOAD GOOGLE PLAY STORE:
          Simpan file 'my-upload-key.jks' ini dengan aman agar pembaruan
          versi berikutnya (v1.1, v2.0, dst.) menggunakan kunci yang sama.
          =============================================================
          EOF

      - name: Upload Signed Release APK (Siap Install)
        uses: actions/upload-artifact@v4
        with:
          name: BawaMobilSR-v1.0-Signed-APK
          path: release-output/bawa-mobil-sr-v1.0-release.apk
          if-no-files-found: error

      - name: Upload Signed Play Store AAB (Siap Upload Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: BawaMobilSR-v1.0-PlayStore-AAB
          path: release-output/bawa-mobil-sr-v1.0-release.aab
          if-no-files-found: error

      - name: Upload Signature Keystore Backup & Info
        uses: actions/upload-artifact@v4
        with:
          name: BawaMobilSR-Signature-Keystore-Backup
          path: |
            release-output/my-upload-key.jks
            release-output/KEYSTORE-INFO.txt
          if-no-files-found: warn
